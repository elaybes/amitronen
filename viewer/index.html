<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exhibition</title>
<script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/openseadragon.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(180deg, #cfcfcf 0%, #f4f4f4 50%, #cfcfcf 100%); }
  #titleBar { position: absolute; top: 24px; left: 0; right: 0; text-align: center; z-index: 10; pointer-events: none; }
  #titleBar h1 { font-family: system-ui, sans-serif; font-weight: 700; font-size: 1.4rem; color: #333; margin: 0; }
  #titleBar .titles { display: flex; justify-content: center; align-items: center; gap: 1rem; flex-wrap: wrap; }
  #titleBar .he { direction: rtl; }
  #titleBar .subtitle { font-family: system-ui, sans-serif; font-weight: 400; font-size: 1.4rem; color: #333; margin: 0.2rem 0 0 0; }
  #osd { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  .caption {
    font-family: system-ui, sans-serif;
    color: #444;
    text-align: center;
    pointer-events: none;
    font-size: 13px;
    line-height: 1.4;
    box-sizing: border-box;
    padding: 0 4px;
    overflow: visible;
  }
  .caption .he { direction: rtl; }
  .caption .dims { opacity: 0.8; }
  #hint { position: absolute; bottom: 10px; right: 14px; font-family: system-ui, sans-serif; font-size: 0.7rem; color: #777; z-index: 10; }
</style>
</head>
<body>
  <div id="titleBar">
    <div class="titles">
      <h1 id="titleEn"></h1>
      <h1 id="titleHe" class="he"></h1>
    </div>
    <div class="subtitle">Amit Ronen | עמית רונן</div>
  </div>
  <div id="osd"></div>
  <div id="hint">drag / arrows / pinch / +&minus; to navigate</div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('exhibition');
    const statusEl = document.getElementById('osd');

    if (!slug) {
      statusEl.innerHTML = '<p style="font-family:system-ui;text-align:center;margin-top:2rem;">Missing ?exhibition= parameter</p>';
    } else {
      loadExhibition(slug);
    }

    async function loadExhibition(slug) {
      const res = await fetch(`../exhibitions/${slug}/config.json`);
      if (!res.ok) {
        statusEl.innerHTML = '<p style="font-family:system-ui;text-align:center;margin-top:2rem;">Exhibition not found</p>';
        return;
      }
      const config = await res.json();
      document.getElementById('titleEn').textContent = config.title_en || '';
      document.getElementById('titleHe').textContent = config.title_he || '';
      document.title = config.title_en || config.title_he || 'Exhibition';

      const baseUrl = `../exhibitions/${slug}/`;
      const images = config.images || [];
      const ITEM_WIDTH = 1; // every image is placed 1 world-unit wide, regardless of its own aspect ratio
      const GAP = 0.15; // gap between images, in the same world units

      const viewer = OpenSeadragon({
        id: 'osd',
        prefixUrl: 'https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/images/',
        showNavigationControl: false,
        showFullPageControl: false,
        gestureSettingsMouse: { clickToZoom: false, dragToPan: true },
        gestureSettingsTouch: { pinchToZoom: true, dragToPan: true },
        minZoomImageRatio: 0.6,
        maxZoomPixelRatio: 4,
        visibilityRatio: 0.1,
        constrainDuringPan: false,
      });

      let nextX = 0;
      images.forEach((img) => {
        const x = nextX;
        nextX += ITEM_WIDTH + GAP;
        viewer.addTiledImage({
          tileSource: baseUrl + img.dzi,
          x,
          y: 0,
          width: ITEM_WIDTH,
          success: (event) => {
            addCaption(viewer, event.item, img);
            // Refit on every successful load (not just the last one) so the view still
            // frames the whole row even if one image is slow or fails to load - this
            // matters inside the Wix iframe embed, where loading can behave differently
            // than viewing the page directly.
            viewer.viewport.goHome(true);
          },
        });
      });

      addKeyboardControls(viewer);
    }

    function addCaption(viewer, item, img) {
      const bounds = item.getBounds();
      const lineEn = [img.caption_en, img.medium_en].filter(Boolean).join(' | ');
      const lineHe = [img.caption_he, img.medium_he].filter(Boolean).join(' | ');
      if (!lineEn && !lineHe && !img.dimensions) return;

      const el = document.createElement('div');
      el.className = 'caption';
      el.innerHTML = `
        ${lineEn ? `<div class="en">${escapeHtml(lineEn)}</div>` : ''}
        ${lineHe ? `<div class="he">${escapeHtml(lineHe)}</div>` : ''}
        ${img.dimensions ? `<div class="dims">${escapeHtml(img.dimensions)}</div>` : ''}
      `;

      // The overlay box is sized to the image's own on-screen width, so at low zoom
      // (box narrow in pixels) captions wrap onto multiple lines and never overlap
      // their neighbors, while at high zoom (box wide) each line fits on one line.
      viewer.addOverlay({
        element: el,
        location: new OpenSeadragon.Rect(bounds.x, bounds.y + bounds.height + 0.04, bounds.width, 0.3),
        checkResize: true,
      });
    }

    function addKeyboardControls(viewer) {
      const PAN_STEP = 0.08;
      const ZOOM_FACTOR = 1.25;
      window.addEventListener('keydown', (e) => {
        const viewport = viewer.viewport;
        switch (e.key) {
          case 'ArrowLeft':
            viewport.panBy(new OpenSeadragon.Point(-PAN_STEP * viewport.getBounds().width, 0));
            break;
          case 'ArrowRight':
            viewport.panBy(new OpenSeadragon.Point(PAN_STEP * viewport.getBounds().width, 0));
            break;
          case 'ArrowUp':
            viewport.panBy(new OpenSeadragon.Point(0, -PAN_STEP * viewport.getBounds().height));
            break;
          case 'ArrowDown':
            viewport.panBy(new OpenSeadragon.Point(0, PAN_STEP * viewport.getBounds().height));
            break;
          case '+':
          case '=':
            viewport.zoomBy(ZOOM_FACTOR);
            break;
          case '-':
          case '_':
            viewport.zoomBy(1 / ZOOM_FACTOR);
            break;
          default:
            return;
        }
        viewport.applyConstraints();
        e.preventDefault();
      });
    }

    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
  </script>
</body>
</html>
